name: build

on:
  push:
    branches: [master, feat/winui3-migration]
  pull_request:
    branches: [master, release/winui3-v3.5.0]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The solution declares only x64; omitting the platform fails with MSB4126.
      - name: Restore
        run: dotnet restore InkCanvas.slnx -p:Platform=x64

      - name: Build
        run: dotnet build InkCanvas.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/InkCanvas.Core.Tests/InkCanvas.Core.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: Test legacy file import with WPF archives
        run: dotnet test tests/InkCanvas.LegacyImport.Tests -c Release -p:Platform=x64 --no-build

      - name: Package legacy import plugin
        run: ./tools/pack-extension.ps1 -Project src/InkCanvas.Plugins.LegacyImport/InkCanvas.Plugins.LegacyImport.csproj -Kind Plugin

      - uses: actions/upload-artifact@v4
        with:
          name: inkcanvas-legacy-import
          path: artifacts/extension-packages/inkcanvas.legacy-import-*.zip

      - name: Publish
        run: dotnet publish src/InkCanvas.App/InkCanvas.App.csproj -c Release -p:Platform=x64 -o artifacts/app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: InkCanvas-winui3-x64
          path: artifacts/app